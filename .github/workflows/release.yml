name: Release
'on':
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max
permissions:
  id-token: write
  contents: write
jobs:
  release:
    uses: WillBooster/reusable-workflows/.github/workflows/release.yml@main
    needs: wasm
    permissions:
      id-token: write
      contents: write
      actions: read
    with:
      github_hosted_runner: true
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v4.3.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: next
        shell: bash
        run: |
          version=$(bun run release-test 2>&1 | sed -n 's/.*The next release version is \([0-9][^ ]*\).*/\1/p' | tail -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  wasm:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - run: bun install --frozen-lockfile
      - run: script/set-grammar-version "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - run: bun run build-wasm
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wasm
          path: tree-sitter-bash.wasm
          if-no-files-found: error
