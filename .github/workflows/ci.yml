name: CI

on:
  push:
    branches: [master]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
  pull_request:
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up tree-sitter
        uses: tree-sitter/setup-action/cli@v2
      - name: Set up examples
        shell: bash
        # The hosts occasionally answer with a server error, so each clone is retried.
        run: |-
          clone() {
            for attempt in 1 2 3 4; do
              rm -rf "$2"
              git clone "$1" "$2" -q --single-branch --depth=1 && return
              sleep $((attempt * 15))
            done
            return 1
          }
          clone https://github.com/Bash-it/bash-it examples/bash-it
          clone https://git.savannah.gnu.org/git/bash.git examples/bash
          clone https://anongit.gentoo.org/git/repo/gentoo.git examples/gentoo
          if [[ $RUNNER_OS != Windows ]]; then
            clone https://github.com/oilshell/wild-corpus examples/wild-corpus
          fi
      - name: Run tests
        uses: tree-sitter/parser-test-action@v3
        with:
          generate: false
          test-rust: false
          test-node: false
          test-python: true
          test-go: true
          test-swift: false
      - name: Parse examples
        uses: tree-sitter/parse-action@v4
        with:
          files: |-
            examples/*.sh
            examples/bash-it/**/*.sh
            examples/bash-it/**/*.bash
            examples/bash/**/*.sh
            examples/bash/**/*.tests
            examples/gentoo/**/*.sh
            examples/gentoo/**/*.eclass
            examples/wild-corpus/**/*.sh
            # examples/gentoo/**/*.ebuild
            !examples/gentoo/app-antivirus/fangfrisch/files/fangfrisch-has-news.sh
            !examples/gentoo/eclass/ruby-fakegem.eclass
          invalid-files-list: script/known-failures.txt
