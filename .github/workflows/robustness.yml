name: Robustness
'on':
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # Runs the parser under libFuzzer with AddressSanitizer and UndefinedBehaviorSanitizer, seeded with the
  # input of each corpus case. A grammar change alters which tokens the scanner is asked for, so it runs
  # on every change, not only on scanner changes. The parser runs on WillBooster/tree-sitter at the
  # @willbooster/web-tree-sitter version in package.json, the runtime the Wasm tests use: the error recovery of
  # upstream's runtime never ends on some inputs.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - id: runtime
        run: |
          version=$(script/runtime-version)
          echo "ref=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          repository: WillBooster/tree-sitter
          ref: ${{ steps.runtime.outputs.ref }}
          path: .tmp/tree-sitter
          persist-credentials: false
      - run: |
          mkdir -p .tmp/fuzz-seeds
          script/fuzz-seeds .tmp/fuzz-seeds $(find test/corpus -name '*.txt' | LC_ALL=C sort)
          # libFuzzer runs just as well without seeds, so the seeds must show that every NUL character reached them.
          corpus_nuls=$(find test/corpus -name '*.txt' -exec cat {} + | tr -dc '\000' | wc -c)
          seed_nuls=$(find .tmp/fuzz-seeds -type f -exec cat {} + | tr -dc '\000' | wc -c)
          echo "NUL characters: $corpus_nuls in the corpus, $seed_nuls in the seeds"
          test "$corpus_nuls" -gt 0
          test "$seed_nuls" -eq "$corpus_nuls"
      - name: Build the fuzzer
        run: |
          jq '.. | select((.type? == "STRING" or (.type? == "ALIAS" and .named? == false)) and .value? != "") | .value' \
            src/grammar.json | grep -v '\\' | iconv -c -f UTF-8 -t ASCII//TRANSLIT > .tmp/fuzz-dict
          cat << 'EOF' > .tmp/fuzzer.c
          #include <assert.h>
          #include <stddef.h>
          #include <stdint.h>
          #include <tree_sitter/api.h>

          #ifndef TS_LANG
          #error TS_LANG must be defined
          #endif

          const TSLanguage *TS_LANG(void);

          int LLVMFuzzerTestOneInput(const uint8_t *data, const size_t len) {
            TSParser *parser = ts_parser_new();
            assert(ts_parser_set_language(parser, TS_LANG()));
            TSTree *tree = ts_parser_parse_string(parser, (const char *)data, len);
            ts_tree_delete(tree);
            ts_parser_delete(parser);
            return 0;
          }
          EOF
          # Only the grammar is instrumented, not the runtime. Omit tree-sitter/fuzz-action's nonnull ignorelist, which
          # masks empty scanner-array copies, and make UBSan fatal so those regressions fail this job.
          clang -std=c11 -Og -g -c -D_POSIX_C_SOURCE=200112L -D_DEFAULT_SOURCE -I.tmp/tree-sitter/lib/include \
            -I.tmp/tree-sitter/lib/src .tmp/tree-sitter/lib/src/lib.c -o .tmp/tree-sitter.o
          clang -std=c11 -Og -g -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined \
            -I.tmp/tree-sitter/lib/include -Isrc \
            -DTS_LANG="tree_sitter_$(jq -r .name src/grammar.json)" .tmp/fuzzer.c src/parser.c \
            $(ls src/scanner.c 2> /dev/null) .tmp/tree-sitter.o -o .tmp/fuzzer
      - name: Fuzz
        run: |
          mkdir -p .tmp/fuzz-out .tmp/fuzz-artifacts
          .tmp/fuzzer .tmp/fuzz-out .tmp/fuzz-seeds -dict=.tmp/fuzz-dict -artifact_prefix=.tmp/fuzz-artifacts/ \
            -timeout=10 -max_total_time=300 -max_len=4096
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: fuzzer-artifacts
          path: .tmp/fuzz-artifacts/
          retention-days: 7
